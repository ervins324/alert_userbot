services:
  monitor:
    build: .
    image: neptun-monitor:latest
    container_name: neptun-monitor
    restart: unless-stopped
    env_file:
      - .env
    # The MTProto session is persisted here so the container never asks
    # for a login code again after the first run.
    volumes:
      - neptun-session:/app/session
    environment:
      - SESSION_FILE=/app/session/session.bin
      - QUEUE_CAPACITY=1000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  neptun-session:
